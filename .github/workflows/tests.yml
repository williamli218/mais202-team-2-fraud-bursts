name: tests

# Runs the test suite on every push and pull request. Fixtures only, no
# downloads, so a run takes well under a minute.
#
# What the result means:
#   - TRACK still None in config.py  -> everything skips (green)
#   - TRACK set, metric not written   -> test_metrics fails (expected until D1.5)
#   - metric written and correct       -> test_metrics passes
#   - predict() still the stub         -> test_predict skips (expected until D2.6)

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: pytest -q
